<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boekmaat — AI bookkeeping copilot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#/dashboard">
      <span class="brand-mark">B<span class="brand-dot">.</span></span>
      <span class="brand-word">Boekmaat</span>
    </a>
    <div class="company-chip">
      <span class="company-avatar">AB</span>
      <span>
        <strong>Atlas Bouw B.V.</strong>
        <small>Rotterdam · NL8523.11.402.B01</small>
      </span>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/></svg>Dashboard</a>
      <a href="#/whatsapp" data-route="whatsapp"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5.2A8 8 0 1 1 21 12z"/></svg>Crew chat <span class="nav-badge live-dot" title="live listener">●</span></a>
      <a href="#/workers" data-route="workers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6M16 5.5a3 3 0 0 1 0 5.4M17.8 14.6c1.7.7 2.8 2.1 3.2 4.4"/></svg>Workers</a>
      <a href="#/invoices" data-route="invoices"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9.5 8.5h5M9.5 12h5M9.5 15.5h3"/></svg>Invoices <span class="nav-badge" id="inboxBadge"></span></a>
      <a href="#/btw" data-route="btw"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8.5 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM15.5 17.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>BTW &amp; export</a>
    </nav>
    <div class="sidebar-foot">
      <div class="ai-status" id="aiStatus"><span class="live-dot">●</span> AI engine</div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
  </aside>
  <main class="main" id="main" aria-live="polite"></main>
</div>
<div class="toasts" id="toasts"></div>
<div class="modal-root" id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
